name: esc-action
description: GitHub Action to inject environment variables and files from a Pulumi ESC environment.
branding:
  icon: unlock
  color: purple
author: Pulumi
inputs:
  environment:
    description: 'The ESC environment to open, as [[<org>/]<project>/]<environment>[@<version>]. A 1-part name is in the "default" project. A name without an org uses the default org of the access token.'
    required: false
    default: ''
  cloud-url:
    description: 'The URL of the Pulumi Cloud API. Defaults to https://api.pulumi.com.'
    required: false
    default: ''
  export-environment-variables:
    description: "Whether or not to export environment variables, or a list of [ENV=]NAME mappings to export. All environment variables are always available as step outputs."
    required: false
  pulumi-access-token:
    description: 'The Pulumi access token to use. Defaults to the PULUMI_ACCESS_TOKEN environment variable.'
    required: false
    default: ''
runs:
  using: 'node24'
  main: 'dist/index.js'
