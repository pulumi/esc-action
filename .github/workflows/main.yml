on:
  - pull_request
permissions:
  id-token: write
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
  test-all-keys:
    strategy: {matrix: {os: [ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v1
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          cloud-url: https://api.pulumi-staging.io
      - name: Open an environment
        id: esc
        uses: ./
        with:
          # This action uses the https://app.pulumi-staging.io/pulumi/esc/github/esc-action environment
          environment: 'pulumi/github/esc-action'
          cloud-url: https://api.pulumi-staging.io
          export-environment-variables: false
      - name: Verify injection
        run: |
          echo "Testing env injection..."
          REQUIRED_VARS=("K1" "K2" "K3")
          for var in "${REQUIRED_VARS[@]}"; do
            if [[ -z "${!var}" ]]; then
              echo "Error: $var is not set or empty" >&2
              exit 1
            fi
            echo "$var is set to: ${!var}"
          done
          if [[ -n $(env | grep "^\(FOO\|SOME_IMPORTANT_KEY\|TEST_ENV\)=") ]]; then
            echo "Error: unexpected variables are set" >&2
            env
            exit 1
          fi
        env:
          K1: ${{ steps.esc.outputs.FOO }}
          K2: ${{ steps.esc.outputs.SOME_IMPORTANT_KEY }}
          K3: ${{ steps.esc.outputs.TEST_ENV }}
  test-individual-key-injection:
    strategy: {matrix: {os: [ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v1
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          cloud-url: https://api.pulumi-staging.io
      - name: Inject only specific environment variables
        id: esc
        uses: ./
        with:
          environment: 'pulumi/github/esc-action'
          export-environment-variables: 'FOO,SOME_IMPORTANT_KEY'
          cloud-url: https://api.pulumi-staging.io
      - name: Verify injection
        run: |
          echo "Testing env injection..."
          REQUIRED_VARS=("FOO" "SOME_IMPORTANT_KEY")
          for var in "${REQUIRED_VARS[@]}"; do
            if [[ -z "${!var}" ]]; then
              echo "Error: $var is not set or empty" >&2
              exit 1
            fi
            echo "$var is set to: ${!var}"
          done
          if [[ -n $(env | grep "^TEST_ENV=") ]]; then
            echo "Error: unexpected variables are set" >&2
            env
            exit 1
          fi
  test-remap-individual-key-injection:
    strategy: {matrix: {os: [ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v1
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          cloud-url: https://api.pulumi-staging.io
      - name: Inject only specific environment variables
        id: esc
        uses: ./
        with:
          environment: 'pulumi/github/esc-action'
          export-environment-variables: 'BAR=FOO,BAZ=SOME_IMPORTANT_KEY,SOME_IMPORTANT_KEY'
          cloud-url: https://api.pulumi-staging.io
      - name: Verify injection
        run: |
          echo "Testing env injection..."
          REQUIRED_VARS=("BAR" "BAZ" "SOME_IMPORTANT_KEY")
          for var in "${REQUIRED_VARS[@]}"; do
            if [[ -z "${!var}" ]]; then
              echo "Error: $var is not set or empty" >&2
              exit 1
            fi
            echo "$var is set to: ${!var}"
          done
          if [[ -n $(env | grep "^\(TEST_ENV\|FOO\)=") ]]; then
            echo "Error: unexpected variables are set" >&2
            env
            exit 1
          fi
  test-envvars-individual-key-injection:
    strategy: {matrix: {os: [ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    env:
      ESC_ACTION_ENVIRONMENT: pulumi/github/esc-action
      ESC_ACTION_EXPORT_ENVIRONMENT_VARIABLES: FOO,SOME_IMPORTANT_KEY
      ESC_ACTION_CLOUD_URL: https://api.pulumi-staging.io
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v1
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          cloud-url: https://api.pulumi-staging.io
      - name: Inject ESC environment variables
        uses: ./
      - name: Verify injection
        run: |
          echo "Testing env injection..."
          REQUIRED_VARS=("FOO" "SOME_IMPORTANT_KEY")
          for var in "${REQUIRED_VARS[@]}"; do
            if [[ -z "${!var}" ]]; then
              echo "Error: $var is not set or empty" >&2
              exit 1
            fi
            echo "$var is set to: ${!var}"
          done
          if [[ -n $(env | grep "^TEST_ENV=") ]]; then
            echo "Error: unexpected variables are set" >&2
            env
            exit 1
          fi
  test-all-key-injection:
    strategy: {matrix: {os: [ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v1
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          cloud-url: https://api.pulumi-staging.io
      - name: Inject ESC environment variables
        uses: ./
        with:
          # This action uses the https://app.pulumi-staging.io/pulumi/esc/github/esc-action environment
          environment: 'pulumi/github/esc-action'
          cloud-url: https://api.pulumi-staging.io
      - name: Verify injection
        run: |
          echo "Testing env injection..."
          REQUIRED_VARS=("FOO" "SOME_IMPORTANT_KEY" "TEST_ENV")
          for var in "${REQUIRED_VARS[@]}"; do
            if [[ -z "${!var}" ]]; then
              echo "Error: $var is not set or empty" >&2
              exit 1
            fi
            echo "$var is set to: ${!var}"
          done
  test-remap-all-key-injection:
    strategy: {matrix: {os: [ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v1
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          cloud-url: https://api.pulumi-staging.io
      - name: Inject ESC environment variables
        uses: ./
        with:
          # This action uses the https://app.pulumi-staging.io/pulumi/esc/github/esc-action environment
          environment: 'pulumi/github/esc-action'
          export-environment-variables: BAR=FOO,*
          cloud-url: https://api.pulumi-staging.io
      - name: Verify injection
        run: |
          echo "Testing env injection..."
          REQUIRED_VARS=("BAR" "SOME_IMPORTANT_KEY" "TEST_ENV")
          for var in "${REQUIRED_VARS[@]}"; do
            if [[ -z "${!var}" ]]; then
              echo "Error: $var is not set or empty" >&2
              exit 1
            fi
            echo "$var is set to: ${!var}"
          done
          if [[ -n $(env | grep "^FOO=") ]]; then
            echo "Error: unexpected variables are set" >&2
            env
            exit 1
          fi
  test-token-input:
    strategy: {matrix: {os: [ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Authenticate with Pulumi Cloud
        id: auth
        uses: pulumi/auth-actions@v1
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          cloud-url: https://api.pulumi-staging.io
      - name: Inject ESC environment variables
        uses: ./
        with:
          # This action uses the https://app.pulumi-staging.io/pulumi/esc/github/esc-action environment
          environment: 'pulumi/github/esc-action'
          cloud-url: https://api.pulumi-staging.io
          pulumi-access-token: ${{ steps.auth.outputs.pulumi-access-token }}
        env:
          # The open fails with this token, so it passes only if the action uses the input.
          PULUMI_ACCESS_TOKEN: pul-invalid
      - name: Verify injection
        run: |
          if [[ -z "$FOO" ]]; then
            echo "Error: FOO is not set or empty" >&2
            exit 1
          fi
          echo "FOO is set to: $FOO"
  test-default-org:
    strategy: {matrix: {os: [ubuntu-latest]}}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Authenticate with Pulumi Cloud
        uses: pulumi/auth-actions@v1
        with:
          organization: pulumi
          requested-token-type: urn:pulumi:token-type:access_token:organization
          cloud-url: https://api.pulumi-staging.io
      - name: Inject ESC environment variables
        uses: ./
        with:
          # The default org of a `pulumi` org token is `pulumi`, so this opens
          # https://app.pulumi-staging.io/pulumi/esc/github/esc-action
          environment: 'github/esc-action'
          cloud-url: https://api.pulumi-staging.io
      - name: Verify injection
        run: |
          echo "Testing env injection..."
          REQUIRED_VARS=("FOO" "SOME_IMPORTANT_KEY" "TEST_ENV")
          for var in "${REQUIRED_VARS[@]}"; do
            if [[ -z "${!var}" ]]; then
              echo "Error: $var is not set or empty" >&2
              exit 1
            fi
            echo "$var is set to: ${!var}"
          done
